# ==========================================
# APPLICATION
# ==========================================

spring.application.name=backend

# Puerto de la aplicación
server.port=8080

# Multipart: el material más grande permitido es 25 MB (M8).
# El request deja margen para los demás campos del formulario.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB


# ==========================================
# DATABASE - PostgreSQL
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/educa360}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Actualiza automáticamente las tablas según tus entidades
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola
spring.jpa.show-sql=true

# Formatear SQL para que sea más legible
spring.jpa.properties.hibernate.format_sql=true

# La sesión JPA se cierra al terminar la petición (buena práctica en API REST,
# evita el "lazy loading fuera de sesión" oculto por Open EntityManager In View)
spring.jpa.open-in-view=false


# ==========================================
# JWT
# ==========================================

# Clave de firma HS256 (mínimo 32 bytes).
# SOLO DESARROLLO: en producción se inyecta desde APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:educa360-dev-secret-key-2026-cambiar-en-produccion-0123456789}

# Validez del token en milisegundos (24 horas)
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}


# Orígenes permitidos para el SPA (separados por coma).
# Producción: APP_CORS_ALLOWED_ORIGINS=https://educa360.pe,https://app.educa360.pe
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}


# ==========================================
# SEGURIDAD - LÍMITE DE INTENTOS DE LOGIN (anti fuerza bruta)
# ==========================================

# 5 fallos dentro de 15 minutos -> login bloqueado 15 minutos (429 + Retry-After).
# La clave es email+IP; un acierto reinicia el contador.
# Ojo: el nombre de la variable sigue el relaxed binding de la propiedad
# (app.security.login.* -> APP_SECURITY_LOGIN_*), el mismo que exportan
# docker-compose.yml y .env.example.
app.security.login.max-attempts=${APP_SECURITY_LOGIN_MAX_ATTEMPTS:5}
app.security.login.window-minutes=${APP_SECURITY_LOGIN_WINDOW_MINUTES:15}
app.security.login.cooldown-minutes=${APP_SECURITY_LOGIN_COOLDOWN_MINUTES:15}


# ==========================================
# SUPABASE STORAGE
# ==========================================

# URL del proyecto Supabase (https://<proyecto>.supabase.co).
# Si está vacía, los endpoints de materiales/sustentos responden 503.
app.supabase.url=${APP_SUPABASE_URL:}

# Service role key: SOLO backend. Nunca se expone al SPA.
app.supabase.service-role-key=${APP_SUPABASE_SERVICE_ROLE_KEY:}


# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework=INFO

